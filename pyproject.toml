[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-pro-skill"
version = "0.1.0"
description = "Evidence-backed, market-aware resume building and optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Resume Pro contributors" }]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "reportlab>=4.0"]

[project.scripts]
resume = "resume_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
