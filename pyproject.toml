[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-pro-skill"
version = "0.2.0"
description = "Evidence-backed, market-aware resume building and optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Resume Pro contributors" }]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "reportlab>=4.0"]

[project.scripts]
resume = "resume_pro.cli:main"

[tool.setuptools]
# Ship templates/, schema/, and profiles/ inside the installed package so a
# normal `pip install .` wheel works outside the repository. The resource
# locators (paths.templates_dir/schema_dir, profile.profiles_dir) check the
# package directory first, then the source-checkout repository root, and honor
# RESUME_PRO_*_DIR overrides in both layouts.
packages = [
  "resume_pro",
  "resume_pro.templates",
  "resume_pro.schema",
  "resume_pro.profiles",
]

[tool.setuptools.package-dir]
"resume_pro" = "src/resume_pro"
"resume_pro.templates" = "templates"
"resume_pro.schema" = "schema"
"resume_pro.profiles" = "profiles"

[tool.setuptools.package-data]
# Only the public cn/en library variants; learned templates/user-* stay private.
"resume_pro.templates" = [
  "cn/*/*.html",
  "cn/*/*.css",
  "cn/*/*.json",
  "en/*/*.html",
  "en/*/*.css",
  "en/*/*.json",
]
"resume_pro.schema" = ["*.json", "*.md", "examples/*.yaml"]
"resume_pro.profiles" = ["*.md", "markets/*.yaml", "personas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
