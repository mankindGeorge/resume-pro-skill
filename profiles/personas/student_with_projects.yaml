schema_version: "1.0"
id: student_with_projects
label: "Student with projects, no internship"
status: stable
seniority: student
markets: [intl_en, cn_internet]
page_budget:
  intl_en: 1
  cn_internet: 2
minimum_facts:
  education: 1
  projects: 2
  project_bullets: 2
  skills: 6
  skills_used_in_projects: 3
required_signals: [education, projects, core_skills]
preferred: [gpa_if_strong, coursework, awards, blog_or_open_source]
question_ladders:
  education: [school, degree, major, start_end, gpa_if_strong, relevant_coursework]
  project: [name, context, problem, own_contribution, optimization, result, tech]
  skills: [languages, frameworks, databases, cs_fundamentals, tools_used_in_projects]
prompt_rules:
  - ask_one_question_at_a_time
  - require_a_number_or_verifiable_outcome
  - reject_demo_only_projects
  - never_invent
  - accept_dont_know
notes:
  - "Two projects are the minimum. One strong project plus a competition or coursework item is also acceptable."
  - "A demo-only project is a blocker until the candidate describes their own change or decision."
