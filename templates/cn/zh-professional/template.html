<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简历</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1 data-slot="identity.name"></h1>
    <div class="contact" data-slot="identity.contact"></div>
    <div class="links" data-slot="identity.links"></div>
  </header>

  <div class="layout">
    <aside class="aside">
      <div class="photo-slot" data-slot="identity.photo"></div>
      <section class="section" data-section="skills"><h2>专业技能</h2><div data-slot="section.skills"></div></section>
      <section class="section" data-section="education"><h2>教育经历</h2><div data-slot="section.education"></div></section>
      <section class="section" data-section="certificates"><h2>证书</h2><div data-slot="section.certificates"></div></section>
      <section class="section" data-section="languages"><h2>语言能力</h2><div data-slot="section.languages"></div></section>
    </aside>

    <main class="main">
      <section class="section" data-section="summary"><h2>个人简介</h2><div data-slot="section.summary"></div></section>
      <section class="section" data-section="experience"><h2>工作经历</h2><div data-slot="section.experience"></div></section>
      <section class="section" data-section="projects"><h2>项目经历</h2><div data-slot="section.projects"></div></section>
      <section class="section" data-section="awards"><h2>荣誉奖项</h2><div data-slot="section.awards"></div></section>
      <section class="section" data-section="publications"><h2>论文 / 发表</h2><div data-slot="section.publications"></div></section>
      <section class="section" data-section="open_source"><h2>开源项目</h2><div data-slot="section.open_source"></div></section>
    </main>
  </div>

  <template data-slot="experience.item">
    <div class="entry">
      <div class="entry-head"><span data-slot="experience.item.title"></span><span data-slot="experience.item.dates"></span></div>
      <template data-slot="experience.item.bullet"><li data-slot="experience.item.bullet.text"></li></template>
    </div>
  </template>
  <template data-slot="project.item">
    <div class="entry">
      <div class="entry-head"><span data-slot="project.item.name"></span><span data-slot="project.item.dates"></span></div>
      <template data-slot="project.item.bullet"><li data-slot="project.item.bullet.text"></li></template>
    </div>
  </template>
</body>
</html>
