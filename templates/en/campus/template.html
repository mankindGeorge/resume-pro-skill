<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1 data-slot="identity.name"></h1>
    <div class="contact" data-slot="identity.contact"></div>
    <div class="links" data-slot="identity.links"></div>
    <div class="photo-slot" data-slot="identity.photo"></div>
  </header>
  <section class="section" data-section="education">
    <h2>Education</h2>
    <div data-slot="section.education"></div>
  </section>

  <section class="section" data-section="skills">
    <h2>Skills</h2>
    <div data-slot="section.skills"></div>
  </section>

  <section class="section" data-section="experience">
    <h2>Work / Internship Experience</h2>
    <div data-slot="section.experience"></div>
  </section>

  <section class="section" data-section="projects">
    <h2>Projects</h2>
    <div data-slot="section.projects"></div>
  </section>

  <section class="section" data-section="awards">
    <h2>Awards</h2>
    <div data-slot="section.awards"></div>
  </section>

  <section class="section" data-section="open_source">
    <h2>Open Source</h2>
    <div data-slot="section.open_source"></div>
  </section>

  <section class="section" data-section="certificates">
    <h2>Certifications</h2>
    <div data-slot="section.certificates"></div>
  </section>

  <section class="section" data-section="languages">
    <h2>Languages</h2>
    <div data-slot="section.languages"></div>
  </section>

  <section class="section" data-section="publications">
    <h2>Publications</h2>
    <div data-slot="section.publications"></div>
  </section>

  <section class="section" data-section="summary">
    <h2>Summary</h2>
    <div data-slot="section.summary"></div>
  </section>

  <template data-slot="education.item">
    <div class="entry">
      <div class="entry-head">
        <span data-slot="education.item.school"></span>
        <span data-slot="education.item.dates"></span>
      </div>
      <div data-slot="education.item.degree"></div>
    </div>
  </template>
  <template data-slot="experience.item">
    <div class="entry">
      <div class="entry-head">
        <span data-slot="experience.item.title"></span>
        <span data-slot="experience.item.dates"></span>
      </div>
      <template data-slot="experience.item.bullet"><li data-slot="experience.item.bullet.text"></li></template>
    </div>
  </template>
  <template data-slot="project.item">
    <div class="entry">
      <div class="entry-head">
        <span data-slot="project.item.name"></span>
        <span data-slot="project.item.dates"></span>
      </div>
      <template data-slot="project.item.bullet"><li data-slot="project.item.bullet.text"></li></template>
    </div>
  </template>
</body>
</html>
